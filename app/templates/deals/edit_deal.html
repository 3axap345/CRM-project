{% extends "base.html" %}
{% block title %}Edit deal{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit deal</h1>
    <a href="{{ url_for('deals.deal_detail', id=deal.id) }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Back
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between">
                <span>Deal details</span>
                <span style="font-size:12px;color:#6b7280">ID: {{ deal.id }}</span>
            </div>
            <div class="card-body">
                {% include "deals/deal_form.html" %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
